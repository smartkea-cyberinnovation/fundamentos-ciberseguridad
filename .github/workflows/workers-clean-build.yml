name: Workers - clean checkout build contract
on:
  pull_request:
    paths: ['term/**', 'wrangler.jsonc', 'campus/**', 'formacion/**', '.github/workflows/workers-clean-build.yml']
  push:
    branches: [main, 'feat/**']
    paths: ['term/**', 'wrangler.jsonc', 'campus/**', 'formacion/**', '.github/workflows/workers-clean-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workers-clean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Offline contract tests
        run: python3 -m unittest discover -s campus/tests -p 'test_workers_build_hook.py' -v
      - name: Install the reviewed deployment lockfile
        run: npm ci --prefix campus/tooling --ignore-scripts --no-audit --no-fund
      - name: Raw versions upload must build missing assets without uploading
        shell: bash
        run: |
          set -euo pipefail
          test ! -d campus/dist
          test ! -d campus/worker-dist
          mkdir -p campus/qa
          node campus/tooling/node_modules/wrangler/bin/wrangler.js versions upload --dry-run --config wrangler.jsonc 2>&1 | tee campus/qa/clean-versions-upload.log
          test -f campus/dist/index.html
          test -f campus/worker-dist/introduccion-ciberseguridad/index.html
          python3 campus/cloudflare.py check
      - name: Raw production dry-run from missing assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import shutil; shutil.rmtree('campus/dist'); shutil.rmtree('campus/worker-dist')"
          node campus/tooling/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.jsonc 2>&1 | tee campus/qa/clean-deploy.log
          python3 campus/cloudflare.py check
      - name: Preserve reviewed source and public release
        run: git archive --format=zip HEAD -o campus/qa/reviewed-source.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: workers-clean-build
          path: |
            campus/qa/reviewed-source.zip
            campus/pages-ready.zip
            campus/qa/clean-*.log
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: workers-clean-failure
          path: campus/qa/clean-*.log
          if-no-files-found: warn
          retention-days: 7
