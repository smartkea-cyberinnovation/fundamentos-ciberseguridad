name: Defensive triage - offline regression

on:
  push:
    branches: [main]
    paths: ['docs/casos/**', '.github/workflows/offline-triage.yml']
  pull_request:
    paths: ['docs/casos/**', '.github/workflows/offline-triage.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Exercise the parser against synthetic fixtures only
        run: python3 -m unittest discover -s docs/casos/c99-20261018/pruebas -p 'test_*.py' -v
