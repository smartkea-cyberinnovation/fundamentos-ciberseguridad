name: TERM - course and isolated Linux labs
on:
  pull_request:
    paths: ['term/**', 'campus/term_integration.py', 'campus/stage_worker.py', 'wrangler.jsonc', '.github/workflows/term.yml']
  push:
    branches: [main, 'feat/**']
    paths: ['term/**', 'campus/term_integration.py', 'campus/stage_worker.py', 'wrangler.jsonc', '.github/workflows/term.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: term-${{ github.ref }}
  cancel-in-progress: true
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build and validate complete teaching edition
        run: |
          python3 term/build.py
          python3 -m unittest discover -s term/tests -p 'test_*.py' -v
          node --test term/tests/*.test.mjs
          python3 campus/cloudflare.py build
          python3 campus/cloudflare.py check
      - name: Browser acceptance dependencies
        run: |
          npm install --prefix /tmp/term-qa --no-audit --no-fund playwright@1.62.1
          /tmp/term-qa/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Desktop and mobile acceptance
        env:
          TERM_TEST_NODE_MODULES: /tmp/term-qa/node_modules
          TERM_TEST_BROWSERS: chromium,webkit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p term/qa
          python3 term/serve.py --port 8791 >term/qa/preview.log 2>&1 &
          TERM_PREVIEW_PID=$!
          trap 'kill "$TERM_PREVIEW_PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8791/fundamentos-ciberseguridad/term/', timeout=2).close()
                  break
              except OSError:
                  if attempt == 29: raise
                  time.sleep(0.2)
          PY
          node term/tests/browser.mjs | tee term/qa/browser.json
          node term/tests/persistence-browser.mjs | tee term/qa/persistence-browser.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: term-course-diagnostics
          path: |
            term/qa/
            term/dist/build-info.json
          retention-days: 7
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Offline lab acceptance
        run: |
          python3 -m pip install -r term/labs/tests/requirements.txt
          python3 -m unittest discover -s term/labs/tests -p 'test_*.py' -v
          docker compose -f term/labs/compose.yaml config --quiet
      - name: Build images and execute synthetic lab
        run: bash term/labs/scripts/smoke.sh
      - name: ShellCheck inside the actual Kali toolbox
        run: docker compose -f term/labs/compose.yaml run --rm --no-deps -T toolbox bash -c 'shellcheck /opt/lab/bin/*.sh'
      - name: Validate Swarm configuration without creating a cluster
        env:
          LAB_WEB_IMAGE: smartkea-term-web:dev
          LAB_TOOLBOX_IMAGE: smartkea-term-toolbox:dev
          LAB_CLOUDFLARED_IMAGE: smartkea-cloudflared:syntax-check-only
          LAB_STUDENT_ID: ci-validation
          LAB_TUNNEL_CONFIG: ci-not-created
          LAB_TUNNEL_SECRET: ci-not-created
        run: docker stack config -c term/labs/stack.yaml -c term/labs/stack.writable.yaml > /dev/null
  public-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [course, labs]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify the exact commit served on both public domains
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 term/verify_public.py --expected-commit "$EXPECTED_COMMIT" --attempts 12 --output term/qa/public-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: term-public-release-evidence
          path: term/qa/public-release.json
          retention-days: 14
