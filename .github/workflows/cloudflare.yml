name: Cloudflare - static deployment acceptance
on:
  push:
    branches: [main, 'feat/**']
    paths: ['term/**', 'wrangler.jsonc', 'campus/**', 'formacion/sistemas-operativos/**', 'formacion/itinerario-integral/**', 'formacion/introduccion-informatica/**', 'formacion/rutas/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['term/**', 'wrangler.jsonc', 'campus/**', 'formacion/sistemas-operativos/**', 'formacion/itinerario-integral/**', 'formacion/introduccion-informatica/**', 'formacion/rutas/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate Wrangler configuration without upload
        shell: bash
        run: |
          set -o pipefail
          mkdir -p campus/qa
          python3 campus/cloudflare.py dry-run 2>&1 | tee campus/qa/wrangler-dry-run.log
          python3 campus/cloudflare.py check
      - name: Audit the locked deployment dependencies
        run: npm audit --prefix campus/tooling --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json"
      - name: Exercise local Workers Static Assets runtime
        shell: bash
        run: |
          set -euo pipefail
          node campus/tooling/node_modules/wrangler/bin/wrangler.js dev --config wrangler.jsonc --local --ip 127.0.0.1 --port 8789 >campus/qa/wrangler-local.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 campus/tests/cloudflare_smoke.py | tee campus/qa/wrangler-smoke.json
      - name: Retain diagnostics without credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-static-diagnostics
          path: |
            campus/qa/wrangler-*
            ${{ runner.temp }}/npm-audit.json
          retention-days: 7
