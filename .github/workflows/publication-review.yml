name: Campus - public publication review
on:
  workflow_dispatch:
  pull_request:
    paths: ['campus/audit_publication.py', '.github/workflows/publication-review.yml']
permissions:
  contents: read
concurrency:
  group: publication-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Observe seven fixed public resources, without authentication
        run: python3 campus/audit_publication.py --output campus/qa/publication.json
      - name: Retain observations even when the live site differs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-publication-review
          path: campus/qa/publication.json
          retention-days: 7
          if-no-files-found: error
