name: Campus - public publication review
on:
  workflow_dispatch:
  pull_request:
    paths: ['campus/audit_publication.py', '.github/workflows/publication-review.yml']
permissions:
  contents: read
concurrency:
  group: publication-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Observe seven fixed public resources, without authentication
        run: python3 campus/audit_publication.py --output campus/qa/publication.json
      - name: Retain observations even when the live site differs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-publication-review
          path: campus/qa/publication.json
          retention-days: 7
          if-no-files-found: error
