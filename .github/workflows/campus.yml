name: Campus - build and acceptance
on:
  push:
    branches: [main, 'feat/**']
    paths: ['term/**', 'campus/**', 'formacion/sistemas-operativos/**', 'formacion/itinerario-integral/**', 'formacion/introduccion-informatica/**', 'formacion/rutas/**', 'formacion/casos/**', '.github/workflows/campus.yml', 'wrangler.jsonc']
  pull_request:
    paths: ['term/**', 'campus/**', 'formacion/sistemas-operativos/**', 'formacion/itinerario-integral/**', 'formacion/introduccion-informatica/**', 'formacion/rutas/**', 'formacion/casos/**', '.github/workflows/campus.yml', 'wrangler.jsonc']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare reports
        run: mkdir -p campus/qa
      - name: Compiler and release unit tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s campus/tests -p 'test_*.py' -v 2>&1 | tee campus/qa/compiler.log
      - name: Generate catalogs before JavaScript consumers
        run: python3 campus/build.py && python3 campus/check_release.py
      - name: Progress and navigation tests
        shell: bash
        run: |
          set -o pipefail
          node --test campus/tests/*.test.mjs 2>&1 | tee campus/qa/state.log
          node --check campus/assets/app.js
      - name: Compile and validate real course
        shell: bash
        run: |
          set -o pipefail
          python3 campus/build.py | tee campus/qa/build.json
          python3 campus/check_release.py | tee campus/qa/release.json
      - name: Install browser test dependency
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Chromium acceptance
        shell: bash
        run: |
          set -o pipefail
          python3 campus/tests/browser_bilingual.py 2>&1 | tee campus/qa/browser.log
          python3 campus/tests/browser_operations.py 2>&1 | tee campus/qa/browser-operations.log
          python3 campus/tests/browser_integral.py 2>&1 | tee campus/qa/browser-integral.log
          python3 campus/tests/browser_exam.py 2>&1 | tee campus/qa/browser-exam.log
          python3 campus/tests/browser_routes.py 2>&1 | tee campus/qa/browser-routes.log
      - name: WebKit acceptance
        shell: bash
        env:
          CAMPUS_BROWSER: webkit
        run: |
          set -o pipefail
          python3 campus/tests/browser_bilingual.py 2>&1 | tee campus/qa/browser-webkit.log
          python3 campus/tests/browser_operations.py 2>&1 | tee campus/qa/browser-operations-webkit.log
          python3 campus/tests/browser_integral.py 2>&1 | tee campus/qa/browser-integral-webkit.log
          python3 campus/tests/browser_exam.py 2>&1 | tee campus/qa/browser-exam-webkit.log
          python3 campus/tests/browser_routes.py 2>&1 | tee campus/qa/browser-routes-webkit.log
      - name: Existing kit tests
        working-directory: formacion/sistemas-operativos/kit
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Existing planning tests
        working-directory: formacion/sistemas-operativos/planificacion
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campus-diagnostics
          path: campus/qa/
          retention-days: 7
      - name: Pages bundle after successful acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-pages-ready
          path: campus/pages-ready.zip
          retention-days: 14
          if-no-files-found: error
      - name: Verified source and site snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campus-es-en-source
          path: |
            campus/
            formacion/sistemas-operativos/
            formacion/itinerario-integral/
            formacion/introduccion-informatica/
            formacion/rutas/
            formacion/casos/
            README.md
            wrangler.jsonc
            .github/workflows/cloudflare.yml
            .github/workflows/campus.yml
            !**/__pycache__/**
            !**/*.pyc
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  public-observation:
    name: Public observation - not production acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Record seven bounded public GET observations
        working-directory: campus
        run: |
          python3 - <<'PY'
          from audit_publication import review
          import json
          from pathlib import Path
          result = review()
          Path('qa').mkdir(exist_ok=True)
          Path('qa/public-observation.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'observationRecorded':True,'publicChecksPassed':result['passed']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-publication-observation
          path: campus/qa/public-observation.json
          retention-days: 7
          if-no-files-found: error
