name: OS study - learning and acceptance
on:
  push:
    branches: [main, feat/os-study-assistant-20260921]
    paths: ['campus/**', '.github/workflows/os-study.yml', 'docs/ESTUDIAR.md', 'docs/QUALITY.md']
  pull_request:
    paths: ['campus/**', '.github/workflows/os-study.yml', 'docs/ESTUDIAR.md', 'docs/QUALITY.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: os-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export source for reproducible review
        run: git archive --format=zip --output="$RUNNER_TEMP/os-study-source.zip" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-study-source
          path: ${{ runner.temp }}/os-study-source.zip
          retention-days: 7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build and validate full static release
        run: |
          python3 campus/build.py
          python3 campus/check_release.py
          python3 campus/stage_worker.py
      - name: Content and timer tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p campus/qa/os-study
          python3 -m unittest discover -s campus/tests -p 'test_os_study.py' -v 2>&1 | tee campus/qa/os-study/python.log
          node --test campus/tests/os-study.test.mjs 2>&1 | tee campus/qa/os-study/model.log
          node --check campus/os_classroom/study.js
      - name: Browser dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium firefox webkit
      - name: Chromium acceptance
        shell: bash
        run: |
          set -o pipefail
          python3 campus/tests/browser_os_study.py 2>&1 | tee campus/qa/os-study/chromium.log
      - name: Firefox acceptance
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CAMPUS_BROWSER: firefox
        run: |
          set -o pipefail
          python3 campus/tests/browser_os_study.py 2>&1 | tee campus/qa/os-study/firefox.log
      - name: WebKit acceptance
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CAMPUS_BROWSER: webkit
        run: |
          set -o pipefail
          python3 campus/tests/browser_os_study.py 2>&1 | tee campus/qa/os-study/webkit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: os-study-evidence
          path: campus/qa/os-study/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-study-accepted-site
          path: campus/pages-ready.zip
          retention-days: 14
          if-no-files-found: error
