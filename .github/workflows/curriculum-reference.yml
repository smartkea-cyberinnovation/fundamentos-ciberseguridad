name: Curriculum reference - structure and arithmetic
on:
  push:
    branches: [main]
    paths:
      - 'formacion/plan-maestro/**'
      - '.github/workflows/curriculum-reference.yml'
  pull_request:
    paths:
      - 'formacion/plan-maestro/**'
      - '.github/workflows/curriculum-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curriculum-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Reference validator tests
        run: python3 -m unittest discover -s formacion/plan-maestro -p 'test_*.py' -v
      - name: Validate current reference
        run: python3 formacion/plan-maestro/validar.py > curriculum-reference-validation.json
      - name: Retain validated reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curriculum-reference
          path: |
            formacion/plan-maestro/
            curriculum-reference-validation.json
            !**/__pycache__/**
            !**/*.pyc
          retention-days: 14
          if-no-files-found: error
