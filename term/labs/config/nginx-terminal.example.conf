# Optional HTTP server block for a host-installed nginx, when iframe is enabled.
# Access and cloudflared remain mandatory; no public listener is introduced.
server {
    listen 127.0.0.1:7683;
    server_name term-a01.smartkea.com;

    add_header Content-Security-Policy "frame-ancestors https://smartkea.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
