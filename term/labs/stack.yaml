# Docker Swarm uses the legacy v3 schema. It does not build images or load .env.
version: "3.8"

x-deployment: &deployment
  replicas: 1
  endpoint_mode: dnsrr
  placement:
    constraints:
      - "node.labels.smartkea.term.student == ${LAB_STUDENT_ID:?Set LAB_STUDENT_ID}"
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
  update_config:
    parallelism: 1
    order: stop-first

services:
  web:
    image: ${LAB_WEB_IMAGE:?Set LAB_WEB_IMAGE to a prebuilt image digest}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    networks: [lab]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 16777216, mode: 01777}
    deploy:
      <<: *deployment
      resources:
        limits: {cpus: "0.5", memory: 128M}
        reservations: {memory: 32M}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  terminal:
    image: ${LAB_TOOLBOX_IMAGE:?Set LAB_TOOLBOX_IMAGE to a prebuilt image digest}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    entrypoint: [/opt/lab/bin/ttyd-start.sh]
    command: [--read-only]
    networks: [lab, terminal_origin]
    volumes:
      - learner_workspace:/workspace
      - learner_home:/home/learner
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 67108864, mode: 01777}
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',7681),2).close()"]
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      <<: *deployment
      resources:
        limits: {cpus: "1.0", memory: 512M}
        reservations: {memory: 128M}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  cloudflared:
    image: ${LAB_CLOUDFLARED_IMAGE:?Set LAB_CLOUDFLARED_IMAGE to an approved image digest}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    command: [tunnel, --no-autoupdate, --config, /etc/cloudflared/config.yml, run]
    networks: [terminal_origin, tunnel_egress]
    configs:
      - source: tunnel_config
        target: /etc/cloudflared/config.yml
        uid: "65532"
        gid: "65532"
        mode: 0400
    secrets:
      - source: tunnel_credentials
        target: lab_tunnel_credentials.json
        uid: "65532"
        gid: "65532"
        mode: 0400
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 16777216, mode: 01777}
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      <<: *deployment
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

# No published ports: Swarm published ports do not retain a loopback host binding.
networks:
  lab:
    driver: overlay
    internal: true
    driver_opts: {encrypted: ""}
  terminal_origin:
    driver: overlay
    internal: true
    driver_opts: {encrypted: ""}
  tunnel_egress:
    driver: overlay

volumes:
  learner_workspace:
  learner_home:

configs:
  tunnel_config:
    external: true
    name: ${LAB_TUNNEL_CONFIG:?Set LAB_TUNNEL_CONFIG}
secrets:
  tunnel_credentials:
    external: true
    name: ${LAB_TUNNEL_SECRET:?Set LAB_TUNNEL_SECRET}
